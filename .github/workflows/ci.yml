name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ht_manager
          POSTGRES_PASSWORD: ht_manager
          POSTGRES_DB: ht_manager
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ht_manager"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://ht_manager:ht_manager@localhost:5432/ht_manager
      TEST_DATABASE_URL: postgresql+asyncpg://ht_manager:ht_manager@localhost:5432/ht_manager_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Create test database
        run: PGPASSWORD=ht_manager psql -h localhost -U ht_manager -d ht_manager -c "CREATE DATABASE ht_manager_test;"

      - name: Verify migrations are reversible
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Check for model/migration drift
        run: alembic check

      - name: Run tests
        run: pytest
