services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ht_manager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ht_manager}
      POSTGRES_DB: ${POSTGRES_DB:-ht_manager}
    restart: unless-stopped
    # Bound to loopback on purpose: the bot reaches Postgres over the Compose
    # network, so the only reason to publish it is local psql/pytest. On the
    # deployment VM (spec §24) a bare "5432:5432" would expose the database to
    # the internet.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ht_manager_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ht_manager}"]
      interval: 5s
      timeout: 5s
      retries: 5

  ht-manager-migrate:
    build: .
    command: alembic upgrade head
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ht_manager}:${POSTGRES_PASSWORD:-ht_manager}@postgres:5432/${POSTGRES_DB:-ht_manager}
    depends_on:
      postgres:
        condition: service_healthy

  ht-manager-bot:
    build: .
    command: python -m ht_manager.main
    # The bot is a long-running daemon: a Discord disconnect that kills the
    # process, or a host reboot, should bring it back without a human.
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ht_manager}:${POSTGRES_PASSWORD:-ht_manager}@postgres:5432/${POSTGRES_DB:-ht_manager}
    depends_on:
      postgres:
        condition: service_healthy
      ht-manager-migrate:
        condition: service_completed_successfully

volumes:
  ht_manager_postgres_data:
